<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The hosts this page is allowed to reach, enforced by the browser rather than promised in a
      README (review LOW). It is the same list src/test/hosts.test.ts asserts over the source and
      the shipped provider bundle — a script or a fetch to anywhere else is refused here even if
      one ever got into the code. No `default-src`: this hardens the directives that carry the
      risk (script, connect, frame) without breaking the fonts and images a static page may add.
      `style-src` keeps 'unsafe-inline' because Vite inlines the app's styles; `script-src` does
      NOT, so no inline script can run.

      Deliberately absent, and load-bearing (2026-09-11): there is NO `default-src`, no
      `form-action` and no `navigate-to`. The phone's Google sign-in is a TOP-LEVEL NAVIGATION to
      accounts.google.com (packages/brain-provider/src/google-redirect-auth.ts), and any of those
      three directives would be able to block the tab from leaving — which would break sign-in on
      the one device this app exists for. src/test/hosts.test.ts asserts they stay absent, and
      apps/notes-web/scripts/verify-csp-navigation.mjs proves against the BUILT site in headless
      Chromium that this policy lets the navigation happen (and that the app boots with no CSP
      violation at all).
      `connect-src` carries oauth2.googleapis.com for sign-out's revoke call.

      Added 2026-09-13 (P28-T06), and nothing else: the Google Picker. A `drive.file` deployment
      has no other way to be handed a folder at all, so the chooser is not optional decoration.
      It needs `apis.google.com` (Google's `api.js` loader — the second and last third-party
      script, plus the `gapi` RPC iframe and the calls it makes), and its dialog renders in an
      iframe served from `docs.google.com` / `drive.google.com`. Three hosts, all Google's, all
      only reachable because the user just tapped "Choose folder".
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' https://accounts.google.com https://apis.google.com; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://apis.google.com https://graph.microsoft.com https://login.microsoftonline.com; frame-src https://accounts.google.com https://apis.google.com https://docs.google.com https://drive.google.com https://login.microsoftonline.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Work Command Notes</title>
    <meta name="description" content="Your notes, from anywhere. Your Brain lives in your own cloud folder — Work Command never sees it." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#1D1C1A" />
    <!-- PWA / Add to Home Screen (iOS Safari reads these, not the manifest, for its own chrome) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notes" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" href="./icons/icon-192.png" />
    <script type="module" crossorigin src="./assets/index-mJH08pw5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Brdiay3s.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
